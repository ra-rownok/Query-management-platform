# ==============================================================================
# QuantumDBA Platform - Docker Compose
# ==============================================================================
# The web application runs containerized with Gunicorn WSGI.
# PostgreSQL runs independently as a container or service on the host server.
# The container connects to the host's PostgreSQL via 'host.docker.internal'.
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantum_dba_web
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_WEB_PORT:-5001}:5001"
    volumes:
      - .:/app


{% extends "base.html" %}

{% block title %}DBA Secure Sign In - QuantumDBA{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="glass-panel" style="width: 100%; max-width: 440px; padding: 2.5rem; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 52px; height: 52px; border-radius: 14px; background: var(--accent-gradient); display: inline-flex; align-items: center; justify-content: center; font-size: 1.6rem; box-shadow: var(--accent-glow); margin-bottom: 1rem;">
                ⚡
            </div>
            <h2 style="font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em;">QuantumDBA Access</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.35rem;">
                Multi-Database Query & Management Platform
            </p>
        </div>

        {% if error %}
            <div class="flash-message flash-error" style="margin-bottom: 1.25rem;">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label" for="username">DBA Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="input-custom" 
                    placeholder="e.g. admin" 
                    required 
                    autofocus
                    autocomplete="username"
                >
            </div>

            <div class="form-group" style="margin-bottom: 1.75rem;">
                <label class="form-label" for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="input-custom" 
                    placeholder="••••••••••••" 
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem;">
                Authenticate & Enter Studio
            </button>
        </form>

        <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); text-align: center;">
            <div style="font-size: 0.78rem; color: var(--text-dim);">
                Default DBA credentials: <strong style="color: var(--accent-cyan);">admin</strong> / <strong style="color: var(--accent-cyan);">admin123</strong>
            </div>
        </div>
    </div>
</div>
{% endblock %}
